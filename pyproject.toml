[project]
name = "cartograph"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
