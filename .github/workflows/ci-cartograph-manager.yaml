name: Verify & Publish (cartograph-manager)

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - 'src/agent_management/**'
      - 'src/cartograph_mcp/**'
      - 'src/trigger_management/**'
      - 'src/shared/**'
      - 'src/main.py'
      - 'src/mcp_servers.yaml'
      - 'tests/mcp_tools/**'
      - 'tests/test_*.py'
      - '.odin/cartograph-manager/**'
      - 'settings.cartograph.json.template'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci-cartograph-manager.yaml'

env:
  ARTIFACT_NAME: cartograph-manager
  VAULT_ADDR: http://secret-store-writer-stag.d11dev.com
  VAULT_SKIP_VERIFY: true
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_VERSION: 1.16.0

jobs:
  ci-cartograph-manager:
    name: cartograph-manager
    runs-on: [onboarding]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upload artifacts
        id: upload-artifacts
        uses: dream-horizon-org/dh-github-actions/upload-artifacts@v1
        with:
          github_token: ${{ secrets.COMMIT_ACCESS_TOKEN }}
